[package]
name = "dcc-mcp-desktop"
version = "0.1.0"
description = "Tauri shell for the dcc-mcp desktop gateway client"
authors = ["loonghao <hal.long@outlook.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.0", features = ["tray-icon"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
