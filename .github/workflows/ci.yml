name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/ci/check-version.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare bundled sidecars
        run: node scripts/ci/fetch-sidecars.mjs x86_64-unknown-linux-gnu
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop-smoke:
    name: Desktop smoke (${{ matrix.platform }})
    needs: contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Prepare bundled sidecars
        run: node scripts/ci/fetch-sidecars.mjs ${{ matrix.platform }}
      - name: Build desktop shell
        run: npm run tauri build -- --target ${{ matrix.platform }} --no-bundle
